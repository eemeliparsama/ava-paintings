<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security: the browser only loads scripts, styles, fonts and images from this site itself -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Ava</title>
  <meta name="description" content="Ask Ava about a painting or a commission.">
  <link rel="canonical" href="https://eemeliparsama.github.io/ava-paintings/contact.html">
  <!-- Favicon: a serif "A" on terracotta -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23c4572e'/><text x='32' y='47' font-family='Georgia,Times,serif' font-size='44' text-anchor='middle' fill='%23f7f3ee'>A</text></svg>">

  <!-- Link previews (WhatsApp, Messenger, Facebook, iMessage…). images/share.jpg is a 1.91:1 crop of Earthly Echo. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ava · Acrylic paintings">
  <meta property="og:title" content="Contact · Ava">
  <meta property="og:description" content="Original acrylic paintings by Ava. See what's available, or ask about a commission.">
  <meta property="og:url" content="https://eemeliparsama.github.io/ava-paintings/contact.html">
  <meta property="og:image" content="https://eemeliparsama.github.io/ava-paintings/images/share.jpg">
  <meta property="og:image:width" content="1277">
  <meta property="og:image:height" content="669">
  <meta property="og:image:alt" content="Detail of Earthly Echo, a green and pink abstract acrylic painting by Ava">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="fi_FI">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Fonts are stored on the site itself (fonts/), so no visitor data goes to Google or Fontshare -->
  <link rel="preload" href="fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <!--
    The header, menu, footer and painting view are added by js/main.js.
    Page text comes from js/translations.js (English + Finnish); the English
    below is only a fallback. Email and Instagram live in js/site.js.
  -->

  <main class="contact-page" id="contact">
    <div class="contact-side">
      <h1 data-i18n="contactTitle">Get in touch</h1>
      <p class="lede" data-i18n="contactText">Want one of these paintings, or something made just for you? Send me a message.</p>

      <!-- No server: "Send message" opens the visitor's email app with the message filled in (main.js) -->
      <form class="contact-form" id="contact-form" novalidate>
        <div class="field-pair">
          <div class="field">
            <label for="cf-first" data-i18n="formFirstName">First name</label>
            <input id="cf-first" name="first" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="cf-last" data-i18n="formLastName">Last name</label>
            <input id="cf-last" name="last" type="text" autocomplete="family-name">
          </div>
        </div>
        <div class="field">
          <label for="cf-email" data-i18n="formEmail">Email</label>
          <input id="cf-email" name="email" type="email" autocomplete="email" required data-i18n-placeholder="formEmailHint" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="cf-message" data-i18n="formMessage">Message</label>
          <textarea id="cf-message" name="message" rows="3" required data-i18n-placeholder="formMessageHint" placeholder="Which painting you're interested in, or what you'd like painted: the size, the colours, where it will hang."></textarea>
        </div>
        <fieldset class="field topics">
          <legend data-i18n="formTopic">What's it about?</legend>
          <label class="check"><input type="checkbox" name="topic" value="topicForSale"> <span data-i18n="topicForSale">A painting for sale</span></label>
          <label class="check"><input type="checkbox" name="topic" value="topicCommission"> <span data-i18n="topicCommission">A commission</span></label>
          <label class="check"><input type="checkbox" name="topic" value="topicOther"> <span data-i18n="topicOther">Something else</span></label>
        </fieldset>
        <button type="submit" class="button form-send"><span data-i18n="formSend">Send message</span></button>
        <p class="form-note" data-i18n="formSendNote">This opens your email app with the message ready to send.</p>
      </form>

      <p class="form-alt">
        <a href="mailto:ava.laitila@gmail.com" data-email data-email-text>ava.laitila@gmail.com</a>
        <span aria-hidden="true">·</span>
        <button type="button" class="text-button copy-email"><span data-i18n="copy" aria-live="polite">Copy</span></button>
      </p>
    </div>

    <!-- A painting as the backdrop for now. Swap the image for a studio photo later if you like;
         the caption is filled in from js/paintings.js by matching the image path. -->
    <figure class="contact-panel" data-painting-image="images/colourful-portrait.jpg">
      <img src="images/colourful-portrait.jpg" alt="">
      <span class="notch notch-tl" aria-hidden="true"></span>
      <figcaption class="notch notch-br">
        <span class="panel-title" id="panel-title"></span>
        <span class="panel-meta" id="panel-meta"></span>
      </figcaption>
      <div class="panel-overlay">
        <p class="panel-statement"><span data-i18n="panelStatement">Every painting is one of a kind.</span></p>
      </div>
    </figure>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/paintings.js"></script>
  <script src="js/site.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
