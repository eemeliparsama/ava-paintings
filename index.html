<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Security: the browser only loads scripts, styles, fonts and images from this site itself -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ava · Acrylic paintings</title>
  <meta name="description" content="Original acrylic paintings by Ava. See what's available, or ask about a commission.">
  <link rel="canonical" href="https://eemeliparsama.github.io/ava-paintings/">
  <!-- Tab icon: Ava's script "A", near-black on light browser themes and near-white on dark ones
       (images/favicon.svg). Safari uses the black PNG; phones' home screen gets apple-touch-icon.png. -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Link previews (WhatsApp, Messenger, Facebook, iMessage…). images/share.jpg is a 1.91:1 crop of Earthly Echo. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ava · Acrylic paintings">
  <meta property="og:title" content="Ava · Acrylic paintings">
  <meta property="og:description" content="Original acrylic paintings by Ava. See what's available, or ask about a commission.">
  <meta property="og:url" content="https://eemeliparsama.github.io/ava-paintings/">
  <meta property="og:image" content="https://eemeliparsama.github.io/ava-paintings/images/share.jpg">
  <meta property="og:image:width" content="1277">
  <meta property="og:image:height" content="669">
  <meta property="og:image:alt" content="Detail of Earthly Echo, a green and pink abstract acrylic painting by Ava">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="fi_FI">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Fonts are stored on the site itself (fonts/), so no visitor data goes to Google or Fontshare -->
  <link rel="preload" href="fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <!--
    The header, menu, footer and painting view are added by js/main.js.
    Page text comes from js/translations.js (English + Finnish); the English
    below is only a fallback. Email and Instagram live in js/site.js.
  -->

  <main class="home" id="top">
    <div class="home-text">
      <h1 class="statement" data-i18n-html="heroTitle">Bright colour and thick, <span class="accent">textured</span> paint.</h1>
      <p class="lede" data-i18n="heroLede">Original acrylic paintings on canvas. Some are for sale, and I take commissions.</p>
      <!-- One of the paintings marked `highlight: true` in js/paintings.js, picked by main.js -->
      <p class="home-caption">
        <span class="badge" id="home-status" hidden></span>
        <em id="home-title"></em>
        <span id="home-meta"></span>
      </p>
      <a class="button" href="gallery.html" data-page="gallery.html"><span data-i18n="viewPaintings">View the paintings</span></a>
    </div>
    <!-- Slides in from the right once the painting has loaded (main.js swaps is-waiting for is-sliding) -->
    <figure class="home-painting is-waiting">
      <button type="button" class="home-open mount" id="home-open">
        <img id="home-img" alt="" fetchpriority="high">
      </button>
    </figure>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/paintings.js"></script>
  <script src="js/site.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
