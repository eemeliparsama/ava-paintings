<body data-page="home">
  <!--
    The header, menu, footer and painting view are added by js/main.js.
    Page text comes from js/translations.js (English + Finnish); the English
    below is only a fallback. Email and Instagram live in js/site.js.
  -->

  <main class="home" id="top">
    <div class="home-text">
      <h1 class="statement" data-i18n-html="heroTitle">Bright colour and thick, <span class="accent">textured</span> paint.</h1>
      <p class="lede" data-i18n="heroLede">Original acrylic paintings on canvas. Some are for sale, and I take commissions.</p>
      <!-- One of the paintings marked `highlight: true` in js/paintings.js, picked by main.js -->
      <p class="home-caption">
        <span class="badge" id="home-status" hidden></span>
        <em id="home-title"></em>
        <span id="home-meta"></span>
      </p>
      <a class="button" href="gallery.html" data-page="gallery.html"><span data-i18n="viewPaintings">View the paintings</span></a>
    </div>
    <figure class="home-painting">
      <button type="button" class="home-open mount" id="home-open">
        <img id="home-img" alt="" fetchpriority="high">
      </button>
    </figure>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/paintings.js"></script>
  <script src="js/site.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
